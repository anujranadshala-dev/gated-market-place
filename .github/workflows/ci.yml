name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npm run build

  lint-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './admin-portal/package-lock.json'
      - run: npm ci
      - run: npm run lint || npm run build

  lint-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client-portal/package-lock.json'
      - run: npm ci
      - run: npm run lint || npm run build

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npm test -- --passWithNoTests || echo "No tests configured yet"

  build-all:
    needs: [lint-backend, lint-admin, lint-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - run: cd backend && npm ci && npm run build
      - run: cd admin-portal && npm ci && npm run build
      - run: cd client-portal && npm ci && npm run build
