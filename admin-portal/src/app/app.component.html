<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col font-sans antialiased transition-colors duration-200">
  @if (isInitializing()) {
    <div class="flex items-center justify-center h-screen">
      <div class="text-center space-y-3">
        <div class="inline-flex w-10 h-10 rounded-xl bg-gradient-to-br from-[#0b3c5d] via-[#2988c8] to-[#d97d10] items-center justify-center text-lg font-extrabold text-white shadow-lg animate-pulse">
          GP
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Restoring session...</p>
      </div>
    </div>
  } @else if (isLoginPage() || !authStore.isAuthenticated()) {
    <router-outlet></router-outlet>
  } @else {
    <div class="flex h-screen overflow-hidden">
      <!-- Fixed Vertical Sidebar Navigation -->
      <app-sidebar></app-sidebar>

      <!-- Main Content Layout Area -->
      <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 dark:bg-slate-950">
        <!-- Top App Bar & Persona Switcher -->
        <app-header></app-header>

        <!-- Scrollable Workspace Canvas -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 dark:bg-slate-950">
          <div class="max-w-7xl mx-auto">
            <router-outlet></router-outlet>
          </div>
        </main>
      </div>
    </div>
  }
</div>
