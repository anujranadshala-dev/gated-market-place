<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col font-sans antialiased transition-colors duration-200">
  @if (isLoginPage() || !authStore.isAuthenticated()) {
    <router-outlet></router-outlet>
  } @else {
    <div class="flex h-screen overflow-hidden">
      <!-- Fixed Vertical Sidebar Navigation -->
      <app-sidebar></app-sidebar>

      <!-- Main Content Layout Area -->
      <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 dark:bg-slate-950">
        <!-- Top App Bar & Persona Switcher -->
        <app-header></app-header>

        <!-- Scrollable Workspace Canvas -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 dark:bg-slate-950">
          <div class="max-w-7xl mx-auto">
            <router-outlet></router-outlet>
          </div>
        </main>
      </div>
    </div>
  }
</div>
