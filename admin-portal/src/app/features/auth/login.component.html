<div class="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(41,136,200,0.12),rgba(255,255,255,0))] dark:bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(41,136,200,0.15),rgba(0,0,0,0))] transition-colors duration-200">
  <div class="w-full max-w-md space-y-8">
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-[#0b3c5d] via-[#2988c8] to-[#d97d10] items-center justify-center text-xl font-extrabold text-white shadow-lg shadow-[#2988c8]/25">
        GP
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">GatedPulse Portal</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">
        B2B2C Gated Marketplace Architecture &bull; Angular 21 Zoneless
      </p>
    </div>

    <!-- Login Form -->
    <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 space-y-4 shadow-xl shadow-slate-200/50 dark:shadow-none">
      
      <div class="pt-4 dark:border-slate-800">
        <form (ngSubmit)="onSubmit()" class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Corporate SSO / Email</label>
            <input
              type="email"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
              placeholder="you@company.com"
              class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-900 transition"
            />
          </div>

          <div>
            <label class="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Password</label>
            <input
              type="password"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
              placeholder="Enter your password"
              class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-900 transition"
            />
          </div>

          <button
            type="submit"
            class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold transition shadow-md shadow-indigo-600/20"
          >
            Authenticate Portal Access &rarr;
          </button>
        </form>

        <div class="text-center pt-3">
          <p class="text-[11px] text-slate-500 dark:text-slate-400">
            Don't have an account?
          <button
            type="button"
            (click)="navigateToSignup()"
            class="text-indigo-600 dark:text-indigo-400 font-semibold hover:text-indigo-700 dark:hover:text-indigo-300 transition"
          >
            Sign Up
          </button>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
