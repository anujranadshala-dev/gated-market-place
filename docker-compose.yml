version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: gated-market-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gated-market-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGO_DB: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/gated-market?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Gated Marketplace}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      CLIENT_PORTAL_URL: ${CLIENT_PORTAL_URL:-http://localhost:3001}
      ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL:-http://localhost:3000}
    depends_on:
      - mongodb
    volumes:
      - ./backend/.env:/app/.env:ro

  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    container_name: gated-market-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}

  client-portal:
    build:
      context: ./client-portal
      dockerfile: Dockerfile
    container_name: gated-market-client
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}

volumes:
  mongodb_data:
